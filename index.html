<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heisann og Hoppsann!</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/gallery.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.png">

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="./js/script.js"></script>
    <script src="/js/gallery.js" defer></script>
</head>
<body>

    <div id="cursor"></div>

    <section class="intro">
        <p title="my portfolio is currently work in progress!!!!!!">(WIP)</p>
        <div class="hero">
            <div id="heroFace">
                <canvas id="face"></canvas>
            </div>
        </div>

        <h1>
            Heisann og Hoppsann
        </h1>
        <div class="intro-sawtooth-wrapper">
            <div class="intro-sawtooth-shape"></div>
        </div>
    </section>

    <div class="cards">
        <div class="card1" id="card">
            <div class="glare"></div>
            <div class="card-content">
                <img src="/img/capture-card.png" alt="">
            </div>
        </div>

        <div class="card2" id="card">
            <div class="glare"></div>
            <div class="card-content">
                <h2>Create</h2>
            </div>
        </div>

        <div class="card3" id="card">
            <div class="glare"></div>
            <div class="card-content">
                <img src="img/code-card.png" alt="">
            </div>
        </div>
    </div>

    <div id="gallery-section" class="gallery-section">
        <div class="gallery-inner">
            <div id="gallery-grid" class="gallery-grid"></div>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <button class="lightbox-icon-btn lightbox-close-btn" id="lightbox-close">×</button>
        <button class="lightbox-icon-btn lightbox-nav-btn lightbox-prev" id="lightbox-prev">‹</button>
        <div id="lightbox-img-wrap" class="lightbox-img-wrap">
            <img id="lightbox-img" src="" alt="">
        </div>
        <button class="lightbox-icon-btn lightbox-nav-btn lightbox-next" id="lightbox-next">›</button>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>

    <footer>
        <div class="footer-sawtooth-wrapper">
            <div class="footer-sawtooth-shape"></div>
        </div>

        <ol class="footer-links">
            <li><a href="https://www.youtube.com/@Hopp5ann/featured" target="_blank" rel="noopener noreferrer">YouTube</a></li>
            <li><a href="https://github.com/Hoppsann" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            <li><a href="https://www.instagram.com/hopp5ann/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
            <li><a href="https://www.linkedin.com/in/even-pettersen-3447a93a6/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        </ol>

        <h1>Contact me!</h1>
        <a href="mailto:contact@hoppsann.com" id="contact">contact@hoppsann.com</a>
    </footer>

</body>
</html>
