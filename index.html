<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heisann og Hoppsann!</title>
    <meta name="description" content="Hoppsann — photography, 3D and code by Even Bjerke Pettersen.">
    <meta name="theme-color" content="#000000">

    <link rel="icon" type="image/png" href="/img/favicon.png">

    <!-- start fetching the heavy stuff as early as possible -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preload" href="/fonts/Geom-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="modulepreload" href="https://unpkg.com/three@0.184.0/build/three.module.js">

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/gallery.css">
    <link rel="stylesheet" href="/css/projects.css">

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="/js/script.js"></script>
    <script src="/js/gallery.js" defer></script>
    <script src="/js/projects.js" defer></script>
</head>
<body>

    <div id="cursor"></div>

    <section class="intro">
        <p title="my portfolio is currently work in progress!!!!!!">(WIP)</p>
        <div class="hero">
            <div id="heroFace">
                <canvas id="face"></canvas>
            </div>
        </div>

        <h1>Heisann og Hoppsann</h1>

        <div class="intro-sawtooth-wrapper">
            <div class="intro-sawtooth-shape"></div>
        </div>
    </section>

    <div class="cards">
        <div class="card card1" role="button" tabindex="0" aria-label="Capture — show photo gallery">
            <div class="glare"></div>
            <div class="card-content">
                <img src="/img/capture-card.webp" alt="Capture" width="720" height="1280" decoding="async" fetchpriority="high">
            </div>
        </div>

        <div class="card card2" role="button" tabindex="0" aria-label="Create">
            <div class="glare"></div>
            <div class="card-content">
                <h2>Create</h2>
            </div>
        </div>

        <div class="card card3" role="button" tabindex="0" aria-label="Code">
            <div class="glare"></div>
            <div class="card-content">
                <img src="/img/code-card.webp" alt="Code" width="720" height="1280" decoding="async">
            </div>
        </div>
    </div>

    <div id="gallery-section" class="gallery-section">
        <div class="gallery-inner">
            <div id="gallery-grid" class="gallery-grid"></div>
        </div>
    </div>

    <section id="projects-section" class="projects-section" aria-label="Code projects">
        <div class="projects-inner">
            <div class="projects-header">
                <h2 class="projects-title">&lt;projects /&gt;</h2>
                <a class="projects-count-link" href="https://github.com/Hoppsann?tab=repositories" target="_blank" rel="noopener noreferrer">
                    <span id="projects-count">GitHub</span> ↗
                </a>
            </div>
            <div id="projects-grid" class="projects-grid"></div>
        </div>
    </section>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox-icon-btn lightbox-close-btn" id="lightbox-close" aria-label="Close">×</button>
        <button class="lightbox-icon-btn lightbox-nav-btn lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
        <div id="lightbox-img-wrap" class="lightbox-img-wrap">
            <img id="lightbox-img" alt="">
        </div>
        <button class="lightbox-icon-btn lightbox-nav-btn lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
        <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>

    <footer>
        <div class="footer-sawtooth-wrapper">
            <div class="footer-sawtooth-shape"></div>
        </div>

        <ol class="footer-links">
            <li><a href="https://www.youtube.com/@Hopp5ann/featured" target="_blank" rel="noopener noreferrer">YouTube</a></li>
            <li><a href="https://github.com/Hoppsann" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            <li><a href="https://www.instagram.com/hopp5ann/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
            <li><a href="https://www.linkedin.com/in/even-pettersen-3447a93a6/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        </ol>

        <h1>Contact me!</h1>
        <a href="mailto:contact@hoppsann.com" id="contact">contact@hoppsann.com</a>
    </footer>

</body>
</html>
